[project]
name = "cleaner"
version = "0.1.0"
description = "Privacy metadata scrubber and LLM text hygiene, with provenance-preserving guarantees"
readme = "README.md"
authors = [
    { name = "Marco", email = "bowlofdata@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "c2pa-python>=0.37.0",
    "pikepdf>=10.0",
    "defusedxml>=0.7.1",
    "tkinterdnd2>=0.4.2",
]

[project.scripts]
cleaner = "cleaner.cli:main"
cleaner-gui = "cleaner.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pillow>=11.0",
    "piexif>=1.1.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
